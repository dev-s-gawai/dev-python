<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List </title>
</head>
<style>

h1{color: aqua;font-family: Verdana, Geneva, Tahoma, sans-serif;font-size: 160%;border: 6px ;background-color: white;padding: 10px;border-radius: 50px;text-align: center ;width: relative ;position: absolute;}
form{text-align: center;padding: 100px;}
ul{text-align:relative ;border: 2px;background-color: white;border-radius: 40px;width: 80%;margin-left:auto;margin-right: auto;}
input{border: 2px;border-radius: 50px;padding: 20px;width:inherit;min-width: 80%;;height:20%;position:inherit;font-size:larger;}
body{background-image: url(https://img-s-msn-com.akamaized.net/tenant/amp/entityid/BB1msP5k.img);background-repeat: no-repeat;background-size:cover;background-attachment: fixed;}
h2{border: 2px;font-size: medium;font-style: normal;border: 2px solid black;border-radius: 50px;}
h3{font-size: inherit;font-style: italic;text-align: left;padding-left:20px;}
td{padding: 0px;border-bottom: 10px;border-bottom-color:black;position: inherit;}
button{position:relative;font-size: relative;border-radius: 20px;color: aliceblue;background-color: black;height: inherit;min-height: 1cm;}
</style>
<body>
   <h1 >"To-Do List" &#128221 </h1>
    <form action="/add" method="post">
        <input type="text" name="task" placeholder="Enter your task here &#9997" required>
    </form>
    <ul>
        {% for task in tasks %}
            <table>
                <tr>
                    <td><button  onclick="window.location.href='/delete/{{ loop.index0 }}';">DELETE</button></td>
                    <td><h3>{{ task }}</h3></td>
                    
                </tr>
            </table>
        {% endfor %}
    </ul>
</body>
</html>
